name: Clusterfork repository validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    name: Clusterfork validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate product, documentation, container and Terraform
        env:
          AA_LLM_KEY_FILE: ''
          AA_SEARCH_KEY_FILE: ''
          CLUSTERFORK_VALIDATION_COMMANDS: >-
            [["python3", "-m", "pip", "install", "--require-hashes", "--requirement", "requirements-dev.txt"],
             ["bash", "scripts/validate.sh"]]
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          for argv in json.loads(os.environ['CLUSTERFORK_VALIDATION_COMMANDS']):
              subprocess.run(argv, check=True)
          PYTHON
