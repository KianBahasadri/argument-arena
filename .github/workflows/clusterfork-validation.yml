name: Clusterfork repository validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Clusterfork validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate product, documentation, container and Terraform
        env:
          AA_LLM_KEY_FILE: ''
          AA_SEARCH_KEY_FILE: ''
          CLUSTERFORK_VALIDATION_COMMANDS: >-
            [["python3", "-m", "pip", "install", "--require-hashes", "--requirement", "requirements-dev.txt"],
             ["bash", "scripts/validate.sh"]]
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          for argv in json.loads(os.environ['CLUSTERFORK_VALIDATION_COMMANDS']):
              subprocess.run(argv, check=True)
          PYTHON
  publish:
    name: Publish container image
    needs: validate
    if: >-
      github.repository == 'KianBahasadri/argument-arena' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/kianbahasadri/argument-arena
    steps:
      - name: Check out validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Pull and smoke-test published image by digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE_NAME@$IMAGE_DIGEST"
          docker run --rm --platform linux/amd64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            "$IMAGE_NAME@$IMAGE_DIGEST" --help
      - name: Record published image
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '### Published container image\n\nTag:\n\n    %s\n\nDeploy this digest:\n\n    %s@%s\n' \
            "$IMAGE_TAG" "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
