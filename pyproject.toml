[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "argument-arena"
version = "0.1.0"
description = "Persistent Discord debates, research, judging, training and profiles"
requires-python = ">=3.12"
dependencies = ["discord.py==2.7.1", "aiohttp==3.14.5"]

[project.scripts]
argument-arena = "arena.__main__:main"

[tool.setuptools.packages.find]
include = ["arena*"]

[tool.setuptools.package-data]
arena = ["fallacies.json"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
